<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <title>تتبع الصحة والتمارين</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 70px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== شاشة السعرات ===== */
        .calories-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .main-circle {
            position: relative;
            width: 200px;
            height: 200px;
        }

        svg circle {
            transition: stroke-dashoffset 0.5s ease;
        }

        .circle-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-weight: bold;
        }

        .circle-text .number {
            font-size: 32px;
            color: #667eea;
            display: block;
        }

        .circle-text .label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .mini-circles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }

        .mini-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .mini-circle svg {
            width: 100px;
            height: 100px;
        }

        .mini-circle-text {
            text-align: center;
        }

        .mini-circle-text .number {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            display: block;
        }

        .mini-circle-text .label {
            font-size: 11px;
            color: #999;
            margin-top: 3px;
        }

        .input-section {
            width: 100%;
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 12px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"],
        input[type="number"],
        select {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            background: #f0f4ff;
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 14px;
            font-family: inherit;
        }

        button:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .meals-list {
            margin-top: 30px;
        }

        .meals-list h3 {
            margin-bottom: 15px;
            color: #667eea;
            font-size: 16px;
        }

        .meal-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meal-info {
            flex: 1;
        }

        .meal-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .meal-details {
            font-size: 12px;
            color: #999;
        }

        .meal-calories {
            font-weight: bold;
            color: #667eea;
            min-width: 50px;
            text-align: center;
        }

        .delete-btn {
            background: #ff6b6b;
            padding: 6px 10px;
            font-size: 12px;
            margin-right: 10px;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        /* ===== شاشة التمارين ===== */
        .exercise-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .exercise-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.3s, background 0.3s;
        }

        .exercise-card.done {
            border-color: #51cf66;
            background: #f1fdf4;
        }

        .exercise-day {
            font-weight: bold;
            color: #333;
            font-size: 15px;
        }

        .exercise-type {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }

        .checkbox {
            width: 50px;
            height: 50px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 24px;
            background: white;
        }

        .checkbox:active {
            transform: scale(0.9);
        }

        .exercise-card.done .checkbox {
            border-color: #51cf66;
            background: #51cf66;
            color: white;
        }

        .stats-section {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border-radius: 12px;
        }

        .stats-section h3 {
            margin-bottom: 15px;
            color: #667eea;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            display: block;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        /* ===== شاشة المراجعة الأسبوعية ===== */
        .review-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .review-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .review-card .date {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .review-card .weight {
            font-size: 28px;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        .review-card .change {
            font-size: 16px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            display: inline-block;
        }

        .weight-input-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .weight-input-section h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex: 1;
        }

        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ===== Bottom Navigation ===== */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            height: 70px;
            background: white;
            border-top: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 100%;
            height: 100%;
            color: #999;
            transition: color 0.3s;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
        }

        .nav-item.active {
            color: #667eea;
        }

        .nav-icon {
            font-size: 24px;
        }

        /* ===== Scroll styling ===== */
        .content::-webkit-scrollbar {
            width: 6px;
        }

        .content::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .content::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .container {
                max-width: 100%;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">📊 تتبع الصحة والتمارين</div>

        <div class="content">
            <!-- شاشة السعرات -->
            <div class="tab-content active" id="calories-tab">
                <div class="calories-container">
                    <!-- الدائرة الرئيسية -->
                    <div class="main-circle">
                        <svg width="200" height="200" viewBox="0 0 200 200">
                            <circle cx="100" cy="100" r="95" fill="none" stroke="#e0e0e0" stroke-width="8"/>
                            <circle id="caloriesCircle" cx="100" cy="100" r="95" fill="none" 
                                    stroke="#667eea" stroke-width="8" stroke-dasharray="596" 
                                    stroke-dashoffset="0" transform="rotate(-90 100 100)"
                                    stroke-linecap="round"/>
                        </svg>
                        <div class="circle-text">
                            <span class="number" id="caloriesDisplay">0</span>
                            <span class="label">السعرات الحرارية</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
