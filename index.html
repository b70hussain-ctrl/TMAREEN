<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>Health & Fitness Tracker | متتبع الصحة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #5568d3;
            --secondary: #764ba2;
            --bg-dark: #0f0f1e;
            --bg-card: #1a1a2e;
            --bg-input: #242442;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border: #2a2a4e;
            --success: #51cf66;
            --danger: #ff6b6b;
            --warning: #ffd43b;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', 'Tahoma', 'Cairo', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .header .sub-text {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* ===== Content Area ===== */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 80px;
            scroll-behavior: smooth;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Scrollbar ===== */
        .content::-webkit-scrollbar {
            width: 6px;
        }

        .content::-webkit-scrollbar-track {
            background: var(--bg-input);
        }

        .content::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        /* ===== TAB 1: السعرات ===== */
        .calories-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .progress-circle-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-circle {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .circle-background {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--bg-card);
            box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.3), 0 4px 15px rgba(102, 126, 234, 0.1);
        }

        .circle-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
        }

        .circle-text .number {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
            line-height: 1;
        }

        .circle-text .label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .circle-text .range {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        svg {
            filter: drop-shadow(0 4px 10px rgba(102, 126, 234, 0.2));
        }

        /* Mini Circles */
        .mini-circles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
        }

        .mini-circle-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .mini-circle-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.15);
        }

        .mini-circle-card .label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-align: center;
        }

        .mini-circle-card .number {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .mini-circle-card .unit {
            font-size: 10px;
            color: var(--text-secondary);
        }

        /* Input Section */
        .input-section {
            width: 100%;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .input-section h3 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-group.full {
            flex-direction: column;
        }

        input[type="text"],
        input[type="number"],
        select {
            flex: 1;
            padding: 12px 15px;
            background: var(--bg-input);
            border: 2px solid var(--border);
            color: var(--text-primary);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        input[type="text"]::placeholder,
        input[type="number"]::placeholder {
            color: var(--text-secondary);
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-input);
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.2);
        }

        .btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #ff5252);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.2);
        }

        /* Meals List */
        .meals-list {
            margin-top: 25px;
        }

        .meals-list h3 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 15px;
        }

        .meal-item {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .meal-item:hover {
            border-color: var(--primary);
            transform: translateX(-5px);
        }

        .meal-info {
            flex: 1;
        }

        .meal-name {
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .meal-macros {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .meal-calories {
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            min-width: 60px;
            text-align: center;
            font-size: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        /* ===== TAB 2: التمارين ===== */
        .exercises-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .exercise-item {
            background: var(--bg-card);
            border: 3px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .exercise-item:hover {
            transform: translateX(-5px);
        }

        .exercise-item.completed {
            border-color: var(--success);
            background: rgba(81, 207, 102, 0.05);
        }

        .exercise-info {
            flex: 1;
        }

        .exercise-day {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 15px;
        }

        .exercise-type {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .checkbox {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 24px;
            background: var(--bg-input);
            flex-shrink: 0;
        }

        .exercise-item.completed .checkbox {
            border-color: var(--success);
            background: var(--success);
            color: white;
        }

        .checkbox:active {
            transform: scale(0.9);
        }

        .exercise-stats {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .exercise-stats h3 {
            color: var(--primary);
            margin-bottom: 15px;
            text-align: center;
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-item {
            background: var(--bg-input);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid var(--primary);
        }

        .stat-number {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            display: block;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* ===== TAB 3: المراجعة الأسبوعية ===== */
        .review-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .weight-input-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba
